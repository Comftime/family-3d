<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="3D-фигурка семьи: покрутите пальцем.">
<meta property="og:type" content="website">
<meta property="og:title" content="Данияр ♥ Зинат">
<meta property="og:description" content="Отбасымыз аман, бақытты болсын! Откройте и покрутите 3D-фигурку семьи.">
<meta property="og:image" content="https://comftime.github.io/family-3d/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://comftime.github.io/family-3d/">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Данияр ♥ Зинат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@1,500;1,700&family=Manrope:wght@400;500;700&display=swap">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
/* Layout: одна колонка-«открытка»: имена, 3D-фигурка на всю ширину, ракурсы-чипы, подпись о печати */
:root {
  --bg: #eef5f7;
  --surface: #ffffff;
  --ink: #12303c;
  --muted: #557079;
  --sky: #0b7f97;      /* голубой флага РК, затемнён для текста */
  --gold: #b8891a;     /* золото флага РК */
  --stage: radial-gradient(120% 90% at 50% 15%, #ffffff 0%, #dfecf0 70%, #d3e4e9 100%);
  --line: #cfe0e5;
  --font-display: "Alegreya", "Georgia", "Times New Roman", serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1a21; --surface: #11252e; --ink: #e4f0f3; --muted: #93adb5; --sky: #45c4dc; --gold: #e2b545;
    --stage: radial-gradient(120% 90% at 50% 15%, #1d3a45 0%, #122a33 65%, #0d2028 100%);
    --line: #1f3b46; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1a21; --surface: #11252e; --ink: #e4f0f3; --muted: #93adb5; --sky: #45c4dc; --gold: #e2b545;
  --stage: radial-gradient(120% 90% at 50% 15%, #1d3a45 0%, #122a33 65%, #0d2028 100%);
  --line: #1f3b46; color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card { max-width: 760px; margin: 0 auto; padding-block: 20px 28px; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-direction: column; gap: 4px; text-align: center; }
.eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
h1 {
  margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 700;
  font-size: clamp(27px, 8vw, 52px); line-height: 1.05; white-space: nowrap;
}
h1 .heart { color: var(--gold); font-style: normal; font-size: .7em; vertical-align: .12em; padding-inline: .12em; }
.wish { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(18px, 4.6vw, 22px); color: var(--sky); text-wrap: balance; }
.wish-ru { font-size: 13px; color: var(--muted); }
.rule { display: flex; align-items: center; gap: 10px; color: var(--gold); margin-top: 6px; }
.rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .45; }
.rule svg { width: 34px; height: 12px; }

.stage {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 5; max-height: 74vh;
  border-radius: 18px; overflow: hidden; background: var(--stage); border: 1px solid var(--line);
}
@media (min-width: 640px) { .stage { aspect-ratio: 5 / 4; } }
model-viewer { width: 100%; height: 100%; --poster-color: transparent; --progress-bar-color: transparent; }
.loading {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding-inline: 24px; text-align: center; color: var(--muted); font-size: 13.5px;
  pointer-events: none; transition: opacity .4s;
}
.loading.done { opacity: 0; }
.loading.failed .bar { display: none; }
.bar { width: min(220px, 60%); height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--sky); transition: width .2s; }
.ar-btn {
  position: absolute; top: 12px; right: 12px; font: 700 13px/1 var(--font-body); color: var(--surface);
  background: var(--sky); border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer;
}
.ar-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hint {
  position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--muted);
  pointer-events: none;
}

.views { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.views button {
  font: 500 14px/1 var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 10px 16px; cursor: pointer; transition: border-color .2s, color .2s;
}
.views button:hover { border-color: var(--sky); }
.views button[aria-pressed="true"] { border-color: var(--sky); color: var(--sky); font-weight: 700; }
.views button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

footer { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.spec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.spec b { display: block; font-size: clamp(12.5px, 3.4vw, 15px); font-variant-numeric: tabular-nums; }
.spec span { font-size: clamp(11px, 2.9vw, 12px); color: var(--muted); line-height: 1.3; display: block; }
@media (prefers-reduced-motion: reduce) { .loading, .bar i, .views button { transition: none; } }
</style>

</head>
<body>
<main class="card">
  <header>
    <div class="eyebrow">Семейная фигурка · 3D</div>
    <h1>Данияр <span class="heart">♥</span> Зинат</h1>
    <div class="wish">Отбасымыз аман, бақытты болсын!</div>
    <div class="wish-ru">Пусть наша семья будет здорова и счастлива</div>
    <div class="rule" aria-hidden="true">
      <svg viewBox="0 0 34 12"><path d="M17 1 L22 6 L17 11 L12 6 Z" fill="currentColor"/><circle cx="5" cy="6" r="1.6" fill="currentColor"/><circle cx="29" cy="6" r="1.6" fill="currentColor"/></svg>
    </div>
  </header>

  <div class="stage">
    <model-viewer id="mv" src="family_3d.glb" ios-src="family_3d.usdz" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" alt="3D-фигурка: папа в форме патрульной полиции, мама в белом халате и двое сыновей держатся за руки"
      camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="0" rotation-per-second="14deg"
      environment-image="neutral" exposure="0.8" tone-mapping="aces" shadow-intensity="1.2" shadow-softness="0.6"
      camera-target="0m 0.075m 0m" camera-orbit="-20deg 76deg 0.44m" field-of-view="30deg"
      min-camera-orbit="auto 0deg 0.06m" max-camera-orbit="auto 105deg 0.8m" interpolation-decay="60"
      interaction-prompt="none">
      <button slot="ar-button" class="ar-btn" type="button">На столе через камеру</button>
    </model-viewer>
    <div class="loading" id="loading">
      <div id="loadtext">Загружаем фигурку (≈9 МБ)…</div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="hint">Крутите пальцем · два пальца — приблизить</div>
  </div>

  <nav class="views" aria-label="Ракурсы">
    <button type="button" id="v-family" aria-pressed="true">Вся семья</button>
    <button type="button" id="v-dad" aria-pressed="false">Данияр</button>
    <button type="button" id="v-mom" aria-pressed="false">Зинат</button>
    <button type="button" id="v-kids" aria-pressed="false">Сыновья</button>
    <button type="button" id="v-plaque" aria-pressed="false">Надпись</button>
    <button type="button" id="v-back" aria-pressed="false">Сзади</button>
  </nav>

  <footer>
    <div class="spec"><b>158 мм</b><span>высота, масштаб ≈ 1:12</span></div>
    <div class="spec"><b>194 × 100 мм</b><span>подставка</span></div>
    <div class="spec"><b>PLA, сопло 0.4</b><span>печать одной деталью</span></div>
  </footer>
</main>

<script>
const mv = document.getElementById("mv");
const views = {
  "v-family": ["0m 0.075m 0m", "-20deg 76deg 0.44m"],
  "v-dad":    ["-0.060m 0.143m -0.015m", "-8deg 84deg 0.14m"],
  "v-mom":    ["0.065m 0.132m -0.021m", "8deg 84deg 0.14m"],
  "v-kids":   ["0m 0.062m -0.01m", "0deg 82deg 0.2m"],
  "v-plaque": ["0m 0.016m 0.04m", "0deg 66deg 0.17m"],
  "v-back":   ["0m 0.075m 0m", "180deg 76deg 0.44m"],
};
const buttons = document.querySelectorAll(".views button");
buttons.forEach(btn => btn.addEventListener("click", () => {
  const [target, orbit] = views[btn.id];
  mv.autoRotate = btn.id === "v-family";
  mv.cameraTarget = target;
  mv.cameraOrbit = orbit;
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
}));
mv.addEventListener("camera-change", e => { if (e.detail.source === "user-interaction") mv.autoRotate = false; });
mv.addEventListener("progress", e => {
  document.getElementById("bar").style.width = Math.round(e.detail.totalProgress * 100) + "%";
});
mv.addEventListener("load", () => {
  // тёплый серо-бежевый, как матовый PLA: на белом теряются лица и мелкие детали
  const pbr = mv.model?.materials[0]?.pbrMetallicRoughness;
  if (pbr) { pbr.setBaseColorFactor([0.62, 0.58, 0.52, 1]); pbr.setRoughnessFactor(0.7); }
  document.getElementById("loading").classList.add("done");
});
mv.addEventListener("error", () => {
  document.getElementById("loading").classList.add("failed");
  document.getElementById("loadtext").textContent = "Не удалось загрузить модель. Обновите страницу.";
});
if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) mv.autoRotate = false;
</script>

</body>
</html>
